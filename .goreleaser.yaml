# goreleaser config for compose-installer.
# The Go binary embeds web/dist — release workflows must build the web UI
# before invoking goreleaser (see .github/workflows/release.yml).
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}-{{ .Os }}-{{ .Arch }}{{- if eq .Os "windows" }}.exe{{ end }}
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

release:
  generate_release_notes: true
